# Configuration de démonstration (D17, amendement 1 ; D26) : EXEMPLE.
#
# Au gel du mardi 10/11 (docs/planning.md), ce fichier est copié en configs/demo.yaml et
# complété avec les expériences retenues à cette date, puis commité. L'application lit
# configs/demo.yaml s'il existe ; sinon, elle garde la correspondance de app/moteurs.py
# (SPECS, DEFAULT_ENGINE). L'en-tête de l'application affiche le fichier en vigueur et
# l'export JSON consigne son empreinte (fiche de reproductibilité).
#
# Un moteur absent de « moteurs » n'est pas proposé : l'en-tête le dit « non retenu pour la
# démonstration ». Seuls l'absence du moteur par défaut et un fichier incohérent arrêtent le
# lancement, avec un message qui dit quoi corriger. Pour
# essayer un fichier sans le mettre en place :
#   uv run python -m app.app --factice --config-demo configs/demo.exemple.yaml

# Date du gel (AAAA-MM-JJ), affichée dans l'en-tête.
gel: 2026-11-10

# Moteur proposé à l'ouverture de l'onglet Analyse (clé d'un moteur ci-dessous). Choisi le
# 9/11 par la règle de D29 ; d'ici là, aucune des deux variantes n'est retenue : décommentez
# celle que la règle désigne en copiant ce fichier en configs/demo.yaml. Sans cette clé,
# l'application garde le défaut du code (app/moteurs.py, DEFAULT_ENGINE).
# Dans les deux cas, l'autre moteur reste proposé, et la comparaison proposée par défaut
# oppose Nemotron 3 et pyannote.
#
# Variante A, pyannote (configuration d'EXP-0007, bornes de 2 à 6 locuteurs) :
# moteur_par_defaut: pyannote-community-1
#
# Variante B, Nemotron 3 Diarization (les quatre conditions de D29 réunies) :
# moteur_par_defaut: nemotron-3

# Moteurs proposés : expérience source (réglages, θ retenu, RTF), et, au besoin, nombre de
# locuteurs proposé par défaut :
#   {mode: automatique}                 nombre estimé par le moteur (défaut si la clé manque)
#   {mode: impose, valeur: N}           N locuteurs
#   {mode: fourchette, min: A, max: B}  entre A et B (pyannote seulement, D17, amendement 1)
# Nemotron 3 Diarization estime seul le nombre de locuteurs (8 au plus) : seul « automatique »
# est accepté pour lui.
moteurs:
  baseline-mfcc:
    experience_source: EXP-0009
  baseline-ecapa:
    experience_source: EXP-0012
  baseline-wespeaker:
    experience_source: EXP-0015
  pyannote-community-1:
    experience_source: EXP-0007
    # Garde-fou retenu par le cockpit le 02/11 (EXP-0018 et EXP-0019), sans gain revendiqué.
    nombre_locuteurs: {mode: fourchette, min: 2, max: 6}
  nemotron-3:
    # Nemotron 3 Diarization (D23, A4 ; D29), système de bout en bout en CPU, dans son
    # environnement séparé (scripts/envs/nemotron.sh). Clé « nemotron-3 », celle des constats.
    # Seuil de décision de 0,35 retenu par le balayage d'EXP-0033 (D29, amendement du 04/11).
    experience_source: EXP-0033
