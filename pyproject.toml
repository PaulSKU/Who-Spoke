[project]
name = "whospoke"
version = "0.1.0"
description = "Who Spoke? — diarisation de locuteurs (qui parle, et quand)"
authors = [
    { name = "Pollos-ECE", email = "paul.sidrot@edu.ece.fr" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pyannote-audio>=4.0.7",
    "pyannote-metrics>=4.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Tests lents exclus par défaut (D19, amendement 5) ; les lancer avec `uv run pytest -m lent`.
markers = [
    "lent: test lent (modèle complet sur un fichier réel), exclu par défaut",
]
addopts = "-m 'not lent'"
