[project]
name = "whospoke"
version = "0.1.0"
description = "Who Spoke? — diarisation de locuteurs (qui parle, et quand)"
authors = [
    { name = "Pollos-ECE", email = "paul.sidrot@edu.ece.fr" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "gradio>=6.31.0",
    "librosa>=0.11.0",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pyannote-audio>=4.0.7",
    "pyannote-metrics>=4.2.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "silero-vad==6.2.3",
    "speechbrain>=1.1.2",
]

[project.scripts]
# Commande en ligne (chantier E1) : `uv run whospoke diarize <audio> …`
whospoke = "whospoke.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Tests lents exclus par défaut (D19, amendement 5) ; les lancer avec `uv run pytest -m lent`.
# Tests `modele` : chargent un modèle pré-entraîné depuis le cache local ; exclus de
# l'intégration continue (suite rapide sans modèle ni jeton, .github/workflows/tests.yml).
markers = [
    "lent: test lent (modèle complet sur un fichier réel), exclu par défaut",
    "modele: charge un modèle pré-entraîné (cache Hugging Face requis), exclu de l'intégration continue",
]
addopts = "-m 'not lent'"
# Racine du dépôt importable, pour les tests de l'application (paquet `app`, D17).
pythonpath = ["."]
