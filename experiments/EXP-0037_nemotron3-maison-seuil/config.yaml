# EXP-0037 — Nemotron 3 Diarization sur le corpus maison (M01), seuil de décision 0,35 : la
# configuration d'EXP-0033 (valeur retenue par son balayage sur SUMM-RE dev), comme EXP-0034 et
# l'application, hors des jeux évalués (A9 ; D29 §2, condition 3, amendement du 04/11). Nouveau
# corpus : aucune expérience de référence, aucune variable modifiée (convention d'EXP-0007).
# Aucun réglage sur ce corpus.
# Confidentialité (consentements non recueillis) : les RTTM d'hypothèse (rttm/) restent en
# local, ignorés par git (.gitignore) ; seules les métriques agrégées sont versionnées.
exp_id: EXP-0037
slug: nemotron3-maison-seuil
reference: null
variable_modifiee: null
graine: 0                      # inférence déterministe ; graine consignée par convention

pipeline:
  nom: nemotron3-diarization   # nvidia/Nemotron-3-Diarization, 8 locuteurs au plus
  vad: integree               # détection faite par le modèle de bout en bout
  parametres:                # nombre de locuteurs estimé par le modèle ; ni imposé ni borné
    threshold: 0.35           # retenu par EXP-0033 (balayage sur SUMM-RE dev)

mode_n_locuteurs: estime
detection_oracle: false

device: cpu
prechauffage_s: 60             # extrait du premier fichier, non compté (protocole §3.5)

jeux:
  - corpus: maison
    partition: test            # corpus maison entièrement en test (protocole §2)
    liste: data/splits/maison/test.txt

evaluation:
  references: data/processed/maison/rttm   # annotation manuelle, fusion à 200 ms (conventions d'annotation)
  uem: data/processed/maison/uem           # repères manuels début et fin (amendement du 05/11), non versionnée
  conditions: {collar_0: 0.0, collar_0_25: 0.5}
  skip_overlap: false

materiel:
  machine: MacBook Pro M2 Pro
  ram_go: 16
