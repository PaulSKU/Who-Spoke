# EXP-0010 — baseline à empreintes ECAPA-TDNN (D22), AMI SDM : balayage de θ sur dev, puis
# dev et test avec le θ retenu. Seule variable par rapport à EXP-0002 : la représentation des
# fenêtres ; θ est balayé à nouveau, l'échelle des distances changeant avec elle (D22).
exp_id: EXP-0010
slug: baseline-ecapa-ami-sdm
reference: EXP-0002
variable_modifiee: representation
graine: 0                     # baseline déterministe ; graine consignée par convention

pipeline:
  nom: baseline               # src/whospoke/pipelines/baseline.py, valeurs de D19 §2 hors représentation
  vad: energie                # seuil sur l'énergie logarithmique (α = 0,3)
  parametres:
    representation: ecapa            # ECAPA-TDNN (src/whospoke/embeddings.py), seule variable (D22)
    normalisation: fichier      # centrage-réduction sur le fichier, comme les MFCC (amendement 1 de D22)

mode_n_locuteurs: estime      # coupe de l'arbre au seuil θ
detection_oracle: false

# Balayage de θ (distance cosinus, lien moyen) sur AMI dev ; valeur de plus faible DER
# sans collar retenue, puis seule utilisée pour l'exécution de dev et de test.
balayage:
  parametre: theta
  debut: 0.10
  fin: 1.50
  pas: 0.05
  partition: dev

device: cpu                   # empreintes en CPU : NaN intermittents en MPS (amendement 2 de D22)
prechauffage_s: 60            # extrait du premier fichier, non compté (protocole §3.5)

jeux:
  - corpus: ami
    partition: dev
    liste: data/splits/ami/dev.txt
  - corpus: ami
    partition: test
    liste: data/splits/ami/test.txt

# Sous-ensemble de mesure du temps (protocole §3.5) : device étant cpu, temps_cpu est
# tiré de l'exécution principale restreinte à ces fichiers.
mesure_cpu:
  corpus: ami
  liste: data/splits/ami/temps.txt

evaluation:
  references: data/processed/ami/rttm   # RTTM only_words, uri réécrit en ami__<réunion>
  uem: data/splits/ami/uem              # UEM du dépôt pyannote/AMI-diarization-setup
  conditions: {collar_0: 0.0, collar_0_25: 0.5}
  skip_overlap: false

materiel:
  machine: MacBook Pro M2 Pro
  ram_go: 16
