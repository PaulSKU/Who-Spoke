# EXP-0035 — Nemotron 3 Diarization sur SUMM-RE test dégradé, 7 conditions de D24, seuil de décision 0,35 (D29 §1, hypothèse 2).
# Variable modifiée par rapport à EXP-0028 : le seuil de décision (0,5 par défaut), fixé à la valeur
# retenue par le balayage d'EXP-0033 sur SUMM-RE dev (0,35, DER sans collar 10,28 %).
# Aucun réglage sur ces jeux : vérification des règles 3 et 4 de D25.
exp_id: EXP-0035
slug: nemotron3-summre-degrade-seuil
reference: EXP-0028
variable_modifiee: seuil       # seuil de décision retenu par EXP-0033 (SUMM-RE dev)
graine: 0                      # inférence déterministe ; graine consignée par convention

pipeline:
  nom: nemotron3-diarization   # nvidia/Nemotron-3-Diarization, 8 locuteurs au plus
  vad: integree               # détection faite par le modèle de bout en bout
  parametres:                # nombre de locuteurs estimé par le modèle ; ni imposé ni borné
    threshold: 0.35           # retenu par EXP-0033 (balayage sur SUMM-RE dev)

mode_n_locuteurs: estime
detection_oracle: false

device: cpu
prechauffage_s: 60             # extrait du premier fichier, non compté (protocole §3.5)

jeux:                         # SUMM-RE test dégradé (D24), références et UEM de SUMM-RE test
  - corpus: summre-rev04
    partition: test
    liste: data/splits/summre/test.txt
  - corpus: summre-rev08
    partition: test
    liste: data/splits/summre/test.txt
  - corpus: summre-bru15
    partition: test
    liste: data/splits/summre/test.txt
  - corpus: summre-bru05
    partition: test
    liste: data/splits/summre/test.txt
  - corpus: summre-cod16
    partition: test
    liste: data/splits/summre/test.txt
  - corpus: summre-cod08
    partition: test
    liste: data/splits/summre/test.txt
  - corpus: summre-salle
    partition: test
    liste: data/splits/summre/test.txt

evaluation:
  references: data/processed/summre/rttm   # mots alignés, fusion à 200 ms, sans jetons non lexicaux (D20)
  uem: data/splits/summre/uem
  conditions: {collar_0: 0.0, collar_0_25: 0.5}
  skip_overlap: false

materiel:
  machine: MacBook Pro M2 Pro
  ram_go: 16
