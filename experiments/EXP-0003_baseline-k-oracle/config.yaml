# EXP-0003 — baseline MFCC, nombre de locuteurs oracle par fichier, AMI SDM (dev et test)
# Seule variable par rapport à EXP-0002 : le nombre de locuteurs, lu dans la référence de
# chaque fichier (locuteurs présents dans l'UEM) et imposé à la coupe de l'arbre (D19 §4).
exp_id: EXP-0003
slug: baseline-k-oracle
reference: EXP-0002
variable_modifiee: mode_n_locuteurs
graine: 0                     # baseline déterministe ; graine consignée par convention

pipeline:
  nom: baseline               # src/whospoke/pipelines/baseline.py, valeurs de D19 §2 amendée
  vad: energie                # seuil sur l'énergie logarithmique (α = 0,3)
  parametres:
    theta: 0.95               # θ retenu par EXP-0002 ; sans effet, la coupe se fait au nombre imposé

mode_n_locuteurs: oracle      # coupe de l'arbre au nombre de locuteurs de la référence
detection_oracle: false

device: cpu                   # baseline en CPU seul (D19)
prechauffage_s: 60            # extrait du premier fichier, non compté (protocole §3.5)

jeux:
  - corpus: ami
    partition: dev
    liste: data/splits/ami/dev.txt
  - corpus: ami
    partition: test
    liste: data/splits/ami/test.txt

# Sous-ensemble de mesure du temps (protocole §3.5) : device étant cpu, temps_cpu est
# tiré de l'exécution principale restreinte à ces fichiers.
mesure_cpu:
  corpus: ami
  liste: data/splits/ami/temps.txt

evaluation:
  references: data/processed/ami/rttm   # RTTM only_words, uri réécrit en ami__<réunion>
  uem: data/splits/ami/uem              # UEM du dépôt pyannote/AMI-diarization-setup
  conditions: {collar_0: 0.0, collar_0_25: 0.5}
  skip_overlap: false

materiel:
  machine: MacBook Pro M2 Pro
  ram_go: 16
