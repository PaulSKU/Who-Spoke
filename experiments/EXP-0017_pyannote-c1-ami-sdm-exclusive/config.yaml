# EXP-0017 — pyannote community-1 sur AMI SDM (Array1-01), dev et test, sortie exclusive évaluée
# (D25, V1 ; planning v2.0, rang A1). Configuration d'EXP-0001, sauf la sortie évaluée :
# `output.exclusive_speaker_diarization` (au plus un locuteur par trame). La sortie
# habituelle de la même exécution est écrite dans rttm_habituelle/ et doit reproduire à
# l'octet les RTTM d'EXP-0001.
exp_id: EXP-0017
slug: pyannote-c1-ami-sdm-exclusive
reference: EXP-0001
variable_modifiee: sortie
graine: 0                     # pipeline déterministe ; graine consignée par convention

pipeline:
  nom: pyannote-community-1   # pyannote/speaker-diarization-community-1, signal en mémoire (D16)
  vad: integree               # segmentation de la pipeline, pas de VAD séparée
  parametres:                 # nombre de locuteurs estimé : aucune contrainte
    num_speakers: null
    min_speakers: null
    max_speakers: null
    sortie: exclusive           # sortie évaluée (D25, V1) ; la sortie habituelle est aussi enregistrée

device: mps
prechauffage_s: 60            # extrait du premier fichier, non compté (protocole §3.5)

jeux:
  - corpus: ami
    partition: dev
    liste: data/splits/ami/dev.txt
  - corpus: ami
    partition: test
    liste: data/splits/ami/test.txt

# Mesure en CPU seul sur le sous-ensemble de mesure du temps (protocole §3.5).
mesure_cpu:
  corpus: ami
  liste: data/splits/ami/temps.txt

evaluation:
  references: data/processed/ami/rttm   # RTTM only_words, uri réécrit en ami__<réunion>
  uem: data/splits/ami/uem              # UEM du dépôt pyannote/AMI-diarization-setup
  conditions: {collar_0: 0.0, collar_0_25: 0.5}
  skip_overlap: false

materiel:
  machine: MacBook Pro M2 Pro
  ram_go: 16
