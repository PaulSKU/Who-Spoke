# EXP-0023 — V3 de D25 sur SUMM-RE, dev et test : sortie exclusive de pyannote intersectée avec
# le masque de parole de Silero VAD (réglage de V2 repris). Configuration de EXP-0016, une seule
# variable : le post-traitement. Porte l'exécution partagée avec EXP-0022 (V2).
exp_id: EXP-0023
slug: pyannote-c1-summre-exclusive-silero
reference: EXP-0016
variable_modifiee: post_traitement   # masque de parole de Silero VAD (D25, V2/V3)
graine: 0                     # pipeline déterministe ; graine consignée par convention

pipeline:
  nom: pyannote-community-1-silero   # pyannote community-1, sortie intersectée avec le masque de Silero (E5)
  vad: integree               # segmentation de la pipeline, pas de VAD séparée
  parametres:                 # nombre de locuteurs estimé : aucune contrainte
    num_speakers: null
    min_speakers: null
    max_speakers: null
    sortie: exclusive               # sortie évaluée ; l'autre sortie de la même exécution est l'autre expérience
    silero: {seuil: 0.8, silence_min_s: 0.0, marge_s: 0.03}   # point retenu sur SUMM-RE dev (results/reglage_silero/2026-11-03_02h17)

mode_n_locuteurs: estime
detection_oracle: false

device: mps
prechauffage_s: 60            # extrait du premier fichier, non compté (protocole §3.5)

jeux:
  - corpus: summre
    partition: dev
    liste: data/splits/summre/dev.txt
  - corpus: summre
    partition: test
    liste: data/splits/summre/test.txt

# Mesure en CPU seul sur le sous-ensemble de mesure du temps (protocole §3.5) :
# 007a_ECRH (présentiel) et 012c_EBPZ (Zoom), 39,5 min (amendement 3 de D20).
mesure_cpu:
  corpus: summre
  liste: data/splits/summre/temps.txt

evaluation:
  references: data/processed/summre/rttm   # mots alignés, fusion à 200 ms, sans jetons non lexicaux (D20 §3, amendement 1)
  uem: data/splits/summre/uem              # premier mot − 1 s, dernier mot + 1 s (D20 §3)
  conditions: {collar_0: 0.0, collar_0_25: 0.5}
  skip_overlap: false

materiel:
  machine: MacBook Pro M2 Pro
  ram_go: 16

# Exécution partagée (décision du cockpit du 02/11 ; whospoke.partage) : une seule exécution,
# portée par EXP-0023 (sortie exclusive), donne EXP-0022 (V2, sortie habituelle) et EXP-0023 (V3).
# Le temps de calcul n'est rapporté que par la porteuse.
execution_partagee:
  porteuse: EXP-0023
  experiences: {EXP-0022: habituelle, EXP-0023: exclusive}
