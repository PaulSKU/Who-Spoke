# EXP-0028 — Nemotron 3 Diarization sur SUMM-RE test dégradé, 7 conditions de D24 (A4).
# Variable modifiée par rapport à EXP-0020 : le moteur (même protocole, mêmes fichiers, mêmes
# références). Comparaison à pyannote community-1 par bootstrap apparié.
# Nemotron 3 Diarization (D23, rang A4 ; docs/recherche/e4-moteurs-externes.md) : environnement
# séparé envs/nemotron (transformers 5.22.1, poids fp32, révision f667ed73), sous-processus.
# Périphérique cpu : en mps, l'exécutant s'arrête sur une exception Metal (NSException, code
# −6) au premier fichier du 03/11 ; en cpu, 5 min d'ES2004a en 5,5 s (RTF 0,018), sans réseau.
exp_id: EXP-0028
slug: nemotron3-summre-degrade
reference: EXP-0020
variable_modifiee: moteur      # Nemotron 3 Diarization au lieu de pyannote community-1
graine: 0                      # inférence déterministe ; graine consignée par convention

pipeline:
  nom: nemotron3-diarization   # nvidia/Nemotron-3-Diarization, 8 locuteurs au plus
  vad: integree               # détection faite par le modèle de bout en bout
  parametres: {}             # nombre de locuteurs estimé par le modèle ; ni imposé ni borné

mode_n_locuteurs: estime
detection_oracle: false

device: cpu
prechauffage_s: 60             # extrait du premier fichier, non compté (protocole §3.5)

jeux:                         # SUMM-RE test dégradé (D24), références et UEM de SUMM-RE test
  - corpus: summre-rev04
    partition: test
    liste: data/splits/summre/test.txt
  - corpus: summre-rev08
    partition: test
    liste: data/splits/summre/test.txt
  - corpus: summre-bru15
    partition: test
    liste: data/splits/summre/test.txt
  - corpus: summre-bru05
    partition: test
    liste: data/splits/summre/test.txt
  - corpus: summre-cod16
    partition: test
    liste: data/splits/summre/test.txt
  - corpus: summre-cod08
    partition: test
    liste: data/splits/summre/test.txt
  - corpus: summre-salle
    partition: test
    liste: data/splits/summre/test.txt

evaluation:
  references: data/processed/summre/rttm   # mots alignés, fusion à 200 ms, sans jetons non lexicaux (D20)
  uem: data/splits/summre/uem
  conditions: {collar_0: 0.0, collar_0_25: 0.5}
  skip_overlap: false

materiel:
  machine: MacBook Pro M2 Pro
  ram_go: 16
