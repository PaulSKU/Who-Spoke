# EXP-0032 — pyannote community-1 sur SUMM-RE, dev et test, niveau d'entrée normalisé (D29 §1).
# Configuration de EXP-0007 ; une seule variable : la normalisation du niveau en entrée.
# Mesure CPU omise : la variable étudiée est la qualité ; temps CPU de cette configuration dans la référence.
exp_id: EXP-0032
slug: pyannote-c1-summre-niveau
reference: EXP-0007
variable_modifiee: normalisation_niveau   # sonie d'entrée ramenée à −29,3 LUFS
graine: 0                     # pipeline déterministe ; graine consignée par convention

pipeline:
  nom: pyannote-community-1   # pyannote/speaker-diarization-community-1, signal en mémoire (D16)
  vad: integree               # segmentation de la pipeline, pas de VAD séparée
  parametres:                 # nombre de locuteurs estimé : aucune contrainte
    num_speakers: null
    min_speakers: null
    max_speakers: null

mode_n_locuteurs: estime
detection_oracle: false

device: mps
prechauffage_s: 60            # extrait du premier fichier, non compté (protocole §3.5)

jeux:
  - corpus: summre
    partition: dev
    liste: data/splits/summre/dev.txt
  - corpus: summre
    partition: test
    liste: data/splits/summre/test.txt


evaluation:
  references: data/processed/summre/rttm   # mots alignés, fusion à 200 ms, sans jetons non lexicaux (D20 §3, amendement 1)
  uem: data/splits/summre/uem              # premier mot − 1 s, dernier mot + 1 s (D20 §3)
  conditions: {collar_0: 0.0, collar_0_25: 0.5}
  skip_overlap: false

materiel:
  machine: MacBook Pro M2 Pro
  ram_go: 16

# Normalisation du niveau en entrée (D29 §1, hypothèse 1 ; A-0004 ; whospoke.niveau) : sonie
# intégrée ITU-R BS.1770-4 ramenée à la médiane de SUMM-RE dev (−29,3 LUFS ; AMI test : −43,9
# en médiane), gain linéaire unique, garde de crête à −1 dBFS, après la normalisation D16.
normalisation_niveau:
  methode: bs1770
  cible_lufs: -29.3
