# EXP-0019 — pyannote community-1 sur AMI SDM (Array1-01), dev et test, nombre de locuteurs
# borné entre 2 et 6 (D23, rang A2 du planning v2.0). Configuration d'EXP-0001, sauf les
# bornes `min_speakers: 2` et `max_speakers: 6` (une seule variable : les bornes du nombre
# de locuteurs). Le nombre de groupes de VBx avant les bornes et le recours éventuel au
# KMeans sont consignés par fichier dans execution_*.json et run.log. Sorties habituelle
# (évaluée) et exclusive (rttm_exclusive/) enregistrées.
exp_id: EXP-0019
slug: pyannote-c1-ami-sdm-borne-2-6
reference: EXP-0001
variable_modifiee: mode_n_locuteurs   # estime -> borne [2, 6]
graine: 0                     # pipeline déterministe ; graine consignée par convention

pipeline:
  nom: pyannote-community-1   # pyannote/speaker-diarization-community-1, signal en mémoire (D16)
  vad: integree               # segmentation de la pipeline, pas de VAD séparée
  parametres:                 # nombre de locuteurs estimé dans des bornes (D23, rang A2)
    num_speakers: null
    min_speakers: 2
    max_speakers: 6
    sortie: habituelle          # sortie évaluée, comme la référence ; la sortie exclusive est aussi enregistrée

mode_n_locuteurs: borne

device: mps
prechauffage_s: 60            # extrait du premier fichier, non compté (protocole §3.5)

jeux:
  - corpus: ami
    partition: dev
    liste: data/splits/ami/dev.txt
  - corpus: ami
    partition: test
    liste: data/splits/ami/test.txt

# Mesure en CPU seul sur le sous-ensemble de mesure du temps (protocole §3.5).
mesure_cpu:
  corpus: ami
  liste: data/splits/ami/temps.txt

evaluation:
  references: data/processed/ami/rttm   # RTTM only_words, uri réécrit en ami__<réunion>
  uem: data/splits/ami/uem              # UEM du dépôt pyannote/AMI-diarization-setup
  conditions: {collar_0: 0.0, collar_0_25: 0.5}
  skip_overlap: false

materiel:
  machine: MacBook Pro M2 Pro
  ram_go: 16
