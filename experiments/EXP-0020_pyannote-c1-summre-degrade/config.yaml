# EXP-0020 — pyannote community-1 sur SUMM-RE test dégradé (D24 ; planning v2.0, rang A3).
# Configuration d'EXP-0007 ; seule variable : le signal (7 conditions de D24, générées par
# scripts/data/make_summre_degrade.py, manifeste data/manifests/summre_degrade.csv), avec les
# références et l'UEM de SUMM-RE test. Sorties habituelle (évaluée) et exclusive
# (rttm_exclusive/<corpus>/) enregistrées (D25). Hypothèses dans rttm/<corpus>/.
# Mesure CPU omise : la dégradation ne change pas le calcul, et le temps CPU de cette
# configuration est celui d'EXP-0007 ; seul le temps MPS est relevé (D24 §4).
exp_id: EXP-0020
slug: pyannote-c1-summre-degrade
reference: EXP-0007
variable_modifiee: signal     # condition de D24 (propre : EXP-0007, partition test)
graine: 0                     # pipeline déterministe ; graine consignée par convention

pipeline:
  nom: pyannote-community-1   # pyannote/speaker-diarization-community-1, signal en mémoire (D16)
  vad: integree               # segmentation de la pipeline, pas de VAD séparée
  parametres:                 # nombre de locuteurs estimé : aucune contrainte
    num_speakers: null
    min_speakers: null
    max_speakers: null

mode_n_locuteurs: estime
detection_oracle: false

device: mps
prechauffage_s: 60            # extrait du premier fichier, non compté (protocole §3.5)

jeux:                         # SUMM-RE test dégradé (D24 §1), 37 réunions par condition
  - corpus: summre-rev04
    partition: test
    liste: data/splits/summre/test.txt
  - corpus: summre-rev08
    partition: test
    liste: data/splits/summre/test.txt
  - corpus: summre-bru15
    partition: test
    liste: data/splits/summre/test.txt
  - corpus: summre-bru05
    partition: test
    liste: data/splits/summre/test.txt
  - corpus: summre-cod16
    partition: test
    liste: data/splits/summre/test.txt
  - corpus: summre-cod08
    partition: test
    liste: data/splits/summre/test.txt
  - corpus: summre-salle
    partition: test
    liste: data/splits/summre/test.txt

evaluation:
  references: data/processed/summre/rttm   # références de SUMM-RE test, inchangées (D24 §1)
  uem: data/splits/summre/uem              # UEM de SUMM-RE test, inchangés
  conditions: {collar_0: 0.0, collar_0_25: 0.5}
  skip_overlap: false

materiel:
  machine: MacBook Pro M2 Pro
  ram_go: 16
