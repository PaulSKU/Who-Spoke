# EXP-0018 — pyannote community-1 sur SUMM-RE, dev et test, nombre de locuteurs borné entre 2
# et 6 (D23, rang A2 du planning v2.0). Configuration d'EXP-0007, sauf les bornes
# `min_speakers: 2` et `max_speakers: 6` (une seule variable : les bornes du nombre de
# locuteurs). Le nombre de groupes de VBx avant les bornes et le recours éventuel au KMeans
# sont consignés par fichier dans execution_*.json et run.log. Sorties habituelle (évaluée)
# et exclusive (rttm_exclusive/) enregistrées.
exp_id: EXP-0018
slug: pyannote-c1-summre-borne-2-6
reference: EXP-0007
variable_modifiee: mode_n_locuteurs   # estime -> borne [2, 6]
graine: 0                     # pipeline déterministe ; graine consignée par convention

pipeline:
  nom: pyannote-community-1   # pyannote/speaker-diarization-community-1, signal en mémoire (D16)
  vad: integree               # segmentation de la pipeline, pas de VAD séparée
  parametres:                 # nombre de locuteurs estimé dans des bornes (D23, rang A2)
    num_speakers: null
    min_speakers: 2
    max_speakers: 6
    sortie: habituelle          # sortie évaluée, comme la référence ; la sortie exclusive est aussi enregistrée

mode_n_locuteurs: borne
detection_oracle: false

device: mps
prechauffage_s: 60            # extrait du premier fichier, non compté (protocole §3.5)

jeux:
  - corpus: summre
    partition: dev
    liste: data/splits/summre/dev.txt
  - corpus: summre
    partition: test
    liste: data/splits/summre/test.txt

# Mesure en CPU seul sur le sous-ensemble de mesure du temps (protocole §3.5) :
# 007a_ECRH (présentiel) et 012c_EBPZ (Zoom), 39,5 min (amendement 3 de D20).
mesure_cpu:
  corpus: summre
  liste: data/splits/summre/temps.txt

evaluation:
  references: data/processed/summre/rttm   # mots alignés, fusion à 200 ms, sans jetons non lexicaux (D20 §3, amendement 1)
  uem: data/splits/summre/uem              # premier mot − 1 s, dernier mot + 1 s (D20 §3)
  conditions: {collar_0: 0.0, collar_0_25: 0.5}
  skip_overlap: false

materiel:
  machine: MacBook Pro M2 Pro
  ram_go: 16
