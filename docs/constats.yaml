# Constats mesurés, rattachés aux étapes du pipeline (D26 ; audit du 01/11, R-U7 et R-U8).
# Tenu par le cockpit à chaque interprétation. Source unique de l'encadré « Ce que nous avons appris »
# (onglet Avancement) et des constats affichés sous chaque étape (onglet Pipeline).
# Champs : id ; etape (identifiant d'étape de src/whospoke/pipelines/catalogue.yaml, ou « evaluation ») ;
# moteurs (identifiants des moteurs concernés, vide = tous) ; texte (une phrase, chiffres compris) ;
# sources (expériences ou analyses) ; confiance (certain | probable | incertain) ; cle (vrai = repris dans l'encadré).

version: 1
date: 2026-11-04

constats:
  - id: C01
    etape: detection
    moteurs: [baseline-ecapa, baseline-wespeaker, baseline-mfcc]
    texte: "La détection par énergie est le premier défaut de la baseline : avec ECAPA, la parole manquée fait 32,3 des 45,9 points de DER sur AMI test, et 21,9 des 33,4 points sur SUMM-RE test."
    sources: [EXP-0010, EXP-0012]
    confiance: certain
    cle: true

  - id: C02
    etape: detection
    moteurs: [baseline-mfcc]
    texte: "Une détection de parole parfaite retire 15,3 points de DER à la baseline MFCC sur AMI test (64,4 → 49,1 %)."
    sources: [EXP-0002, EXP-0004]
    confiance: certain
    cle: false

  - id: C03
    etape: segmentation
    moteurs: [pyannote-community-1]
    texte: "À empreinte identique (WeSpeaker), pyannote devance la baseline de 29,3 points sur AMI test, dont 21,1 de parole manquée : son avance vient surtout de la segmentation neuronale, qui détecte la parole et le chevauchement."
    sources: [EXP-0001, EXP-0013]
    confiance: certain
    cle: true

  - id: C04
    etape: detection
    moteurs: [pyannote-community-1]
    texte: "En français (SUMM-RE test), la fausse alarme est la première erreur de pyannote : 11,3 des 26,3 points de DER ; 34 à 44 % se trouve dans des pauses de 1 s au plus d'un même locuteur, que pyannote recouvre, et environ un quart vient de faux chevauchements."
    sources: [EXP-0007, A-0001]
    confiance: certain
    cle: true

  - id: C05
    etape: representation
    moteurs: [baseline-mfcc, baseline-ecapa]
    texte: "Remplacer les MFCC par des empreintes ECAPA fait tomber la confusion de la baseline de 27,1 à 8,6 points sur AMI test, et de 24,4 à 8,5 sur SUMM-RE test."
    sources: [EXP-0002, EXP-0010, EXP-0009, EXP-0012]
    confiance: certain
    cle: true

  - id: C06
    etape: representation
    moteurs: [baseline-ecapa, baseline-wespeaker]
    texte: "Sous oracles, ECAPA et WeSpeaker ne se distinguent pas (écart +2,2 points, IC à 95 % [−0,1 ; +4,6]) ; en condition réaliste, WeSpeaker est légèrement moins bon (+2,5 à +3,3 points)."
    sources: [EXP-0011, EXP-0014, EXP-0013, EXP-0015]
    confiance: certain
    cle: false

  - id: C07
    etape: regroupement
    moteurs: [pyannote-community-1]
    texte: "Donner à pyannote le nombre exact de locuteurs ne l'améliore pas : +0,48 point sur AMI test, −0,72 point non significatif sur SUMM-RE test."
    sources: [EXP-0005, EXP-0008]
    confiance: certain
    cle: true

  - id: C08
    etape: regroupement
    moteurs: [baseline-wespeaker]
    texte: "Avec le seuil réglé pour minimiser le DER, la baseline WeSpeaker ne trouve jamais le bon nombre de locuteurs sur AMI test (0/16), alors que son DER reste proche de celui d'ECAPA (7/16)."
    sources: [EXP-0013, EXP-0010]
    confiance: certain
    cle: false

  - id: C09
    etape: evaluation
    moteurs: []
    texte: "Sur SUMM-RE, le DER sans collar varie de 5 à 8 points selon la règle de découpage de la référence, le DER avec collar de moins de 0,6 point : les deux sont toujours rapportés."
    sources: [A-0001]
    confiance: certain
    cle: true

  - id: C10
    etape: evaluation
    moteurs: [pyannote-community-1]
    texte: "AMI surestime pyannote, qui l'a vu à l'entraînement : à empreinte identique, son avance sur la baseline est de 29,3 points sur AMI test, mais de 9,6 points en français (SUMM-RE test)."
    sources: [EXP-0013, EXP-0001, EXP-0015, EXP-0007]
    confiance: probable
    cle: true

  - id: C11
    etape: segmentation
    moteurs: [pyannote-community-1]
    texte: "Sur des réunions, le chevauchement réel pèse plus que le faux chevauchement : la sortie exclusive de pyannote retire 3 points de fausse alarme sur SUMM-RE test, mais ajoute 8,4 points de parole manquée (DER +4,1 sur SUMM-RE, +4,6 sur AMI, significatif)."
    sources: [EXP-0016, EXP-0017]
    confiance: certain
    cle: true

  - id: C12
    etape: regroupement
    moteurs: [pyannote-community-1]
    texte: "Borner le nombre de locuteurs entre 2 et 6 ne change qu'une réunion sur 73, celle où VBx n'en trouvait qu'un ; l'effet global n'est pas significatif (−0,48 point sur SUMM-RE test)."
    sources: [EXP-0018, EXP-0019]
    confiance: certain
    cle: false

  - id: C13
    etape: segmentation
    moteurs: [pyannote-community-1]
    texte: "La réverbération forte est la faiblesse de pyannote : en salle simulée à RT60 ≈ 0,9 s, son DER passe de 26,3 à 41,2 % sur SUMM-RE test, presque entièrement en parole manquée (7,2 → 23,2 points), et il perd son avance sur la baseline (+0,4 point, non significatif). Il résiste en revanche au bruit et au codec à 16 kbit/s (moins d'un point)."
    sources: [EXP-0020, EXP-0021, A-0002]
    confiance: certain
    cle: true

  - id: C14
    etape: detection
    moteurs: [baseline-ecapa]
    texte: "Le bruit est la faiblesse de la baseline : sa détection par énergie perd de la parole (+14,0 points de DER à 5 dB de RSB), alors que la réverbération la gêne moins (+7,4 points)."
    sources: [EXP-0021, A-0002]
    confiance: certain
    cle: false

  - id: C15
    etape: representation
    moteurs: []
    texte: "Un codec de visio à bas débit (Opus 8 kbit/s) dégrade surtout l'attribution : la confusion de pyannote passe de 7,9 à 14,4 points, et des locuteurs sont fusionnés (13 % de l'erreur vient d'un locuteur de référence non apparié)."
    sources: [EXP-0020, A-0003]
    confiance: certain
    cle: false

  - id: C16
    etape: detection
    moteurs: [pyannote-community-1]
    texte: "Un post-traitement par Silero VAD réglé sur SUMM-RE (micros-casques) réduit le DER de pyannote de 2,6 points en français, mais l'augmente de 22 points sur AMI (micro distant) en coupant la parole lointaine : un réglage fait en champ proche ne se transporte pas en champ lointain."
    sources: [EXP-0022, EXP-0024]
    confiance: certain
    cle: true

  - id: C17
    etape: evaluation
    moteurs: []
    texte: "Le chevauchement est le premier facteur d'échec identifiable : c'est le descripteur le plus lié au DER (corrélation de rang 0,59 à 0,65 pour pyannote), et la moitié à deux tiers de l'erreur sans collar de pyannote n'est qu'un décalage de frontière, que le collar pardonne."
    sources: [A-0003]
    confiance: probable
    cle: true

  - id: C18
    etape: segmentation
    moteurs: [nemotron-3]
    texte: "En français, Nemotron 3 Diarization (bout en bout, 100 M de paramètres) divise presque par deux le DER de pyannote sur SUMM-RE test (14,6 contre 26,3 %) et résiste à toutes les dégradations de D24 (14,8 à 18,5 %), y compris la réverbération forte où pyannote atteint 41,2 % ; son gain vient de la fausse alarme et de la confusion, presque nulles."
    sources: [EXP-0027, EXP-0028]
    confiance: certain
    cle: true

  - id: C19
    etape: segmentation
    moteurs: [nemotron-3]
    texte: "Sur AMI (anglais, micro distant), Nemotron 3 fait moins bien que pyannote (27,5 contre 19,9 %) : il manque environ deux fois plus de parole, même hors chevauchement. Ni la durée des réunions, ni le niveau d'enregistrement, ni le seuil de décision ne l'expliquent : avec le seuil réglé, l'écart reste de +6,5 points."
    sources: [EXP-0026, EXP-0034, A-0004]
    confiance: certain
    cle: true

  - id: C20
    etape: segmentation
    moteurs: [nemotron-3]
    texte: "La parole manquée de Nemotron 3 sur AMI est fortement corrélée au niveau d'enregistrement (rang −0,70), mais amplifier le signal jusqu'à +19 dB ne la change pas : le niveau n'est pas la cause. Dans toutes les salles d'AMI, Nemotron 3 manque environ 2,4 fois plus de parole que pyannote : il est globalement plus prudent, et le champ lointain l'accentue."
    sources: [A-0004, EXP-0029, EXP-0031]
    confiance: probable
    cle: false

  - id: C21
    etape: segmentation
    moteurs: [nemotron-3]
    texte: "Régler le seuil de décision de Nemotron 3 sur SUMM-RE dev (0,35 au lieu de 0,5) l'améliore un peu partout, en français (−0,4 point), sur AMI (−1,0) et dans les 7 conditions dégradées : il manque moins de parole, au prix d'un peu plus de fausse alarme."
    sources: [EXP-0033, EXP-0034, EXP-0035]
    confiance: certain
    cle: false


  - id: C22
    etape: evaluation
    moteurs: [pyannote-community-1, nemotron-3]
    texte: "Sur la première réunion réelle du corpus maison (M01 : voiture, 3 locuteurs, 9 min), Nemotron 3 fait 14,7 % de DER sans collar contre 34,1 % pour pyannote (6,9 contre 19,6 % avec collar). pyannote ne trouve que 2 locuteurs et confond aussi les deux autres (14,4 points de confusion) ; Nemotron 3 en trouve 3, avec 0,7 point de confusion, mais manque un peu plus de parole (6,6 contre 4,3 points)."
    sources: [EXP-0036, EXP-0037, A-0005]
    confiance: certain
    cle: true
